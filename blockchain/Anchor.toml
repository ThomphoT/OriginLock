[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.26"

[features]
seeds = true
skip-lint = false

[programs.localnet]
originlock = "ORILOCk111111111111111111111111111111111111"

[programs.devnet]
originlock = "ORILOCk111111111111111111111111111111111111"

[programs.mainnet]
originlock = "ORILOCk111111111111111111111111111111111111"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
deploy = "anchor deploy"
export-idl = "node scripts/export-idl.js"
verify = "ts-node scripts/verify.ts"
