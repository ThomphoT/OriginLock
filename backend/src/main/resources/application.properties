spring.application.name=origin-lock
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
jwt.secret=${ORIGINLOCK_JWT_SECRET:originlock-development-secret-key-change-before-production-2026}
jwt.expiration-ms=${ORIGINLOCK_JWT_EXPIRATION_MS:86400000}
polygon.amoy.rpc-url=${POLYGON_AMOY_RPC_URL:https://rpc-amoy.polygon.technology}
blockchain.verification.enabled=${ORIGINLOCK_BLOCKCHAIN_VERIFICATION_ENABLED:false}

spring.datasource.url=${ORIGINLOCK_DB_URL:jdbc:postgresql://localhost:5432/originlock}
spring.datasource.username=${ORIGINLOCK_DB_USERNAME:thomphochauke}
spring.datasource.password=${ORIGINLOCK_DB_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080
